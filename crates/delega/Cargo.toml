[package]
name = "delega"
description = "Run Claude Code and Codex agents from the command line or over MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["claude", "codex", "mcp", "cli"]
categories = ["command-line-utilities"]
publish = true

[[bin]]
name = "delega"
path = "src/main.rs"

[dependencies]
clap.workspace = true
delega-core.workspace = true
delega-mcp.workspace = true
# `poll` and `PIPE_BUF`, for a write of the result that a signal can stop
# without leaving its outcome in doubt (commands/output.rs). The tests use them
# to fill and watch pipes.
rustix = { workspace = true, features = ["event", "pipe"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
jsonschema.workspace = true
tempfile.workspace = true

[lints]
workspace = true
