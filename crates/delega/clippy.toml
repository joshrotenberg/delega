# Every child process this crate starts, in its code and in its tests, holds
# the process layer's spawn lock, so concurrent spawns cannot inherit each
# other's pipes on macOS (#104, #107). The code holds
# `delega_core::process::spawn_guard()` across each spawn, and the integration
# tests spawn through `support::Guarded` (`tests/support/mod.rs`). `output` and
# `status` spawn too. This file replaces the workspace `clippy.toml` for this
# crate, so it repeats the tokio entries.
disallowed-methods = [
  { path = "tokio::process::Command::spawn", reason = "spawn through delega-core's process layer, which holds the spawn lock (#104)" },
  { path = "tokio::process::Command::output", reason = "spawn through delega-core's process layer, which holds the spawn lock (#104)" },
  { path = "tokio::process::Command::status", reason = "spawn through delega-core's process layer, which holds the spawn lock (#104)" },
  { path = "std::process::Command::spawn", reason = "hold delega_core::process::spawn_guard() across the spawn; tests use support::Guarded (#107)" },
  { path = "std::process::Command::output", reason = "hold delega_core::process::spawn_guard() across the spawn; tests use support::Guarded (#107)" },
  { path = "std::process::Command::status", reason = "hold delega_core::process::spawn_guard() across the spawn; tests use support::Guarded (#107)" },
]
