[package]
name = "delega-core"
description = "Run Claude Code and Codex agents with a versioned request and result contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["claude", "codex", "agents", "supervisor"]
categories = ["development-tools"]
publish = true

[dependencies]
jsonschema.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
# `net` passes the provider's pipes to the keeper (SCM_RIGHTS), `stdio` reads
# the keeper's control socket on fd 0, `pipe` makes the provider's pipes.
rustix = { workspace = true, features = ["fs", "net", "stdio", "pipe"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# `pipe` for the spawn-lock test, which holds a pipe without close-on-exec.
rustix = { workspace = true, features = ["pipe"] }

[lints]
workspace = true

[package.metadata.dist]
dist = false
