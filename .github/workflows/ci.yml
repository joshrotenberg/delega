name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The keeper and the gap tests depend on timing on Linux (the keeper's
      # walk races the tree it stops), so they run five more times there; any
      # failure fails the job.
      - name: Keeper and gap tests, five repeats (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3 4 5; do
            echo "keeper and gap tests, repeat $attempt of 5"
            cargo test --locked -p delega-core --lib -- \
              process::keeper:: process::tests::keeper:: process::tests::gaps::
          done
      - name: Processes left by the tests
        if: always()
        run: ps -axo pid,ppid,command | grep -E "fake-claude|fake-codex|sleep 300" | grep -v grep || true

  acceptance:
    name: acceptance matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full acceptance run
        run: cargo run --release --locked -p delega-acceptance -- --all --out acceptance-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results-${{ matrix.os }}
          path: acceptance-results.jsonl
      # A gap row that shows no survivor is not a failure in one run (it depends
      # on timing), so a fixed gap is noticed by running the timing-dependent
      # gap rows three times: a row that shows no gap in all three is gap_closed.
      - name: Timing-dependent known-gap rows, three repeats
        run: cargo run --release --locked -p delega-acceptance -- --timing-gaps --repeat 3 --out acceptance-gaps.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-gap-repeats-${{ matrix.os }}
          path: acceptance-gaps.jsonl
      # On Linux the keeper alone must stop a fork relay after a SIGKILL of
      # delega (the k-relay rows). Whether a generation slips past depends on
      # timing, so those rows run ten more times; any survivor fails the job.
      - name: SIGKILL with a fork relay, ten repeats (Linux)
        if: runner.os == 'Linux'
        run: cargo run --release --locked -p delega-acceptance -- --filter=-k-relay --repeat 10 --out acceptance-k-relay.jsonl
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: acceptance-k-relay-repeats
          path: acceptance-k-relay.jsonl
      # The 12 relay rows (both providers; cases a, c, d, e, fd and k) run five
      # more times on Linux, where the keeper stops the relay. A row fails
      # when what it measured differs from what the matrix expects for it
      # (acceptance/README.md); on Linux that includes no survivor, and for
      # the 10 rows that report a result, cleanup Confirmed. The two k-relay
      # rows (SIGKILL of delega) report no result and so no cleanup verdict;
      # they are checked for exit status and survivors. As in every acceptance
      # step, the harness reruns a row (up to 5 runs in all) when its only
      # problem is the verdict for a late listing before the first signal, so
      # that verdict alone does not fail the job. Any other failure does.
      - name: Every relay row, five repeats (Linux)
        if: runner.os == 'Linux'
        run: cargo run --release --locked -p delega-acceptance -- --filter=-relay --repeat 5 --out acceptance-relay.jsonl
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: acceptance-relay-repeats
          path: acceptance-relay.jsonl

  msrv:
    name: build on the minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
