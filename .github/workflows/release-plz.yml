name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-plz:
    name: Release-plz
    # Off until the repository variable RELEASE_ENABLED is "true" and the
    # COMMITTER_TOKEN and CARGO_REGISTRY_TOKEN secrets exist; without the gate
    # every push to main would fail on the missing secrets.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.COMMITTER_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # release-plz releases an unpublished version unchanged, so a -dev version
      # on main would be published as is. Set the release version first.
      - name: Refuse a development version
        run: |
          if grep -Eq '^version = "[^"]*-dev"' Cargo.toml; then
            echo "::error::The workspace version ends in -dev. Set the release version in Cargo.toml before releasing."
            exit 1
          fi

      - name: Run release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
