name: docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - book.toml
      - .mdbook-lint.toml
      - README.md
      - acceptance/README.md
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - book.toml
      - .mdbook-lint.toml
      - README.md
      - acceptance/README.md
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MDBOOK_VERSION: '0.5.4'
      MDBOOK_LINT_VERSION: '0.16.2'
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation tools
        run: |
          tool_dir="$RUNNER_TEMP/docs-tools"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$tool_dir/mdbook.tar.gz"
          tar -xzf "$tool_dir/mdbook.tar.gz" -C "$tool_dir" mdbook
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/joshrotenberg/mdbook-lint/releases/download/v${MDBOOK_LINT_VERSION}/mdbook-lint-x86_64-unknown-linux-gnu.tar.xz" \
            --output "$tool_dir/mdbook-lint.tar.xz"
          tar -xJf "$tool_dir/mdbook-lint.tar.xz" -C "$tool_dir" --strip-components=1 \
            mdbook-lint-x86_64-unknown-linux-gnu/mdbook-lint
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Lint documentation
        run: mdbook-lint lint --config .mdbook-lint.toml docs
      - name: Build the book
        run: mdbook build
