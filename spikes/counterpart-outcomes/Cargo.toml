[package]
name = "counterpart-outcomes-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Measures counterpart's worker runner against delega acceptance criteria 1 and 2"

# Not part of any workspace.
[workspace]

[dependencies]
counterpart-core = { path = "../../../counterpart/crates/counterpart-core", default-features = false, features = ["workers"] }
libc = "0.2"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "io-std"] }
