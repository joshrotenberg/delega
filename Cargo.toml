[workspace]
members = ["crates/delega", "crates/delega-core", "crates/delega-mcp", "acceptance"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/delega"
publish = false

[workspace.dependencies]
delega-core = { path = "crates/delega-core" }
delega-mcp = { path = "crates/delega-mcp" }
clap = { version = "4.6", features = ["derive"] }
jsonschema = { version = "0.61", default-features = false }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
tokio-util = "0.7"
# Reads the user-level configuration file (delega_core::config). Nothing in the
# tree parsed TOML before. Pinned, with only the parser and serde support: no
# TOML writer or other optional features.
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "parse"] }
tower-mcp = { version = "=0.27.0", default-features = false, features = ["skills", "schema-validation"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
